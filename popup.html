<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnet Link Copier</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h3>Magnet Link Copier</h3>
    <p id="status">Scanning page...</p>

    <div id="picker" hidden>
        <label class="select-all">
            <input type="checkbox" id="selectAll" checked>
            Select all (<span id="count">0</span>)
        </label>
        <ul id="list"></ul>
        <button class="copy-btn" id="copySelected">Copy selected</button>
    </div>

    <p class="github-link"><a href="https://github.com/Perciville5241/MagnetCopy" target="_blank" rel="noopener">View on GitHub</a></p>
    <script src="popup.js"></script>
</body>
</html>
